---
layout: default
---

<div class="container">
  <article class="page article-content">

    <div class="eyebrow">
      DEVELOPMENT JOURNAL
    </div>

    <div class="post-date">
      {{ page.date | date: "%B %d, %Y" }}
    </div>

    <h1>{{ page.title }}</h1>

    {% if page.categories %}
      <p>
        <span class="highlight">
          {{ page.categories | join: " · " }}
        </span>
      </p>
    {% endif %}

    <hr style="border: 1px solid #30243b; margin: 30px 0;">

    {{ content }}

    <p>
      <a href="{{ '/devlog/' | relative_url }}">← BACK TO DEVELOPMENT LOG</a>
    </p>

  </article>
</div>
