
---
layout: default
---

<div class="container">
  <article class="page article-content">

    <div class="eyebrow">
      WEEKLY DEVELOPMENT JOURNAL
    </div>

    <div class="post-date">
      {{ page.week }} · {{ page.period }}
    </div>

    <h1>{{ page.title }}</h1>

    <p class="intro">
      {{ page.description }}
    </p>

    <hr style="border: 1px solid #30243b; margin: 30px 0;">

    {{ content }}

    <hr style="border: 1px solid #30243b; margin: 35px 0;">

    <a href="{{ '/devlog/' | relative_url }}">
      ← BACK TO WEEKLY UPDATES
    </a>

  </article>
</div>
