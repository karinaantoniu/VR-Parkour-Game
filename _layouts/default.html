<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: "VR Parkour" }} | Development Journal</title>

  <style>
    :root {
      --background: #0d0b12;
      --surface: #191421;
      --purple: #a855f7;
      --purple-dark: #7135a8;
      --text: #ffffff;
      --muted: #aaa0b5;
      --border: #30243b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 40px, 1050px);
      margin: auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(13, 11, 18, 0.97);
      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
    }

    .logo {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span { color: var(--purple); }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--purple);
    }

    main { min-height: 70vh; }

    .page {
      padding: 90px 0;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 58px);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 27px;
      margin: 35px 0 12px;
    }

    h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .highlight { color: var(--purple); }

    .intro {
      font-size: 17px;
      max-width: 650px;
    }

    .button {
      display: inline-block;
      background: var(--purple-dark);
      padding: 12px 23px;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 12px;
    }

    .button:hover { background: var(--purple); }

    .post-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 25px;
      margin: 18px 0;
      transition: 0.2s;
    }

    .post-card:hover {
      border-color: var(--purple);
      transform: translateY(-3px);
    }

    .post-date {
      color: var(--purple);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .post-card h3 { margin: 8px 0; }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 30px;
    }

    .article-content {
      max-width: 760px;
    }

    .article-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 20px 0;
    }

    .article-content ul,
    .article-content ol {
      color: var(--muted);
      padding-left: 25px;
      margin-bottom: 20px;
    }

    .article-content a { color: var(--purple); }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 750px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
        gap: 15px;
      }

      .page { padding: 60px 0; }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <nav>
        <a href="{{ '/' | relative_url }}" class="logo">
          VR <span>/</span> PARKOUR
        </a>

        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/devlog/' | relative_url }}">Devlog</a></li>
          <li><a href="{{ '/mechanics/' | relative_url }}">Mechanics</a></li>
          <li><a href="{{ '/level-design/' | relative_url }}">Level Design</a></li>
          <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      VR PARKOUR · DEVELOPMENT JOURNAL
    </div>
  </footer>

</body>
</html>
